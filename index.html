<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐐 Kshitij Calculator 🐐 </title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #080d18 0%, #030509 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }
    .calculator {
      width: 440px;
      background: linear-gradient(145deg, #11151e, #090c12);
      border: 1px solid #0055ff;
      border-radius: 2px;
      padding: 22px;
      box-shadow: 0 0 35px rgba(0, 102, 255, 0.25), 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(0, 180, 255, 0.2);
    }
    .calc-title {
      text-align: center;
      margin-bottom: 14px;
      font-size: 1.6rem; font-weight: 900; letter-spacing: 3px;
      background: linear-gradient(90deg, #00d2ff, #0072ff, #3a7bd5);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
    }
    .mode-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    .mode-toggle {
      display: flex; background: #070a0f;
      border-radius: 0; overflow: hidden;
      border: 1px solid #0055ff;
    }
    .mode-toggle button {
      border: none; background: transparent;
      color: rgba(255,255,255,0.4); font-size: 0.72rem; font-weight: 700;
      padding: 5px 14px; cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
      border-radius: 0;
    }
    .mode-toggle button.active {
      background: linear-gradient(135deg, #0052d4, #4364f7);
      color: #fff; border-radius: 0;
      box-shadow: inset 0 0 8px rgba(0, 210, 255, 0.4);
    }
    .display {
      background: #05070c;
      border: 1px solid #003388;
      border-radius: 0;
      padding: 16px 20px; margin-bottom: 16px;
      text-align: right; min-height: 90px;
      display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
      box-shadow: inset 0 3px 12px rgba(0, 0, 0, 0.8), 0 0 10px rgba(0, 85, 255, 0.15);
    }
    .display .expression { font-size: 0.85rem; color: #00d2ff; opacity: 0.7; min-height: 1.2em; word-break: break-all; }
    .display .result { font-size: 2.3rem; font-weight: 700; color: #ffffff; text-shadow: 0 0 10px rgba(0, 180, 255, 0.4); word-break: break-all; transition: font-size 0.15s; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .numpad-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 10px; }
    .section-label {
      grid-column: span 4; text-align: center;
      font-size: 0.62rem; font-weight: 700; letter-spacing: 2px;
      color: #00a8ff; opacity: 0.6; text-transform: uppercase; padding: 4px 0 0;
    }
    .divider { border: none; border-top: 1px solid rgba(0, 119, 255, 0.25); margin: 12px 0 4px; }
    .btn {
      height: 56px; border: 1px solid rgba(0, 102, 255, 0.2); border-radius: 0;
      font-size: 1.4rem; font-weight: 700; cursor: pointer;
      transition: all 0.15s ease;
      color: #ffffff; background: linear-gradient(180deg, #181d28 0%, #0d111a 100%);
      user-select: none; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    .btn:hover {
      background: linear-gradient(180deg, #222938 0%, #131924 100%);
      border-color: #0088ff;
      box-shadow: 0 0 12px rgba(0, 136, 255, 0.4);
    }
    .btn:active { transform: scale(0.96); box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8); }
    .btn.modifier {
      background: linear-gradient(180deg, #1e2638 0%, #121824 100%);
      color: #70b4ff; font-weight: 800;
      border-color: rgba(0, 136, 255, 0.35);
    }
    .btn.modifier:hover {
      background: linear-gradient(180deg, #2a354d 0%, #182233 100%);
      border-color: #00b4ff; color: #fff;
    }
    .btn.operator {
      background: linear-gradient(180deg, #0052d4 0%, #002b80 100%);
      color: #ffffff; font-weight: 800;
      border-color: #0077ff;
      box-shadow: 0 0 10px rgba(0, 102, 255, 0.3);
    }
    .btn.operator:hover {
      background: linear-gradient(180deg, #0066ff 0%, #003db3 100%);
      box-shadow: 0 0 16px rgba(0, 136, 255, 0.6);
      border-color: #00d2ff;
    }
    .btn.operator.active {
      box-shadow: 0 0 18px #00d2ff, inset 0 0 8px rgba(255,255,255,0.4);
      border-color: #00d2ff;
    }
    .btn.equals {
      background: linear-gradient(180deg, #00b4db 0%, #0083b0 100%);
      color: #fff; font-weight: 800;
      border-color: #00e1ff;
      box-shadow: 0 0 14px rgba(0, 210, 255, 0.4);
    }
    .btn.equals:hover {
      background: linear-gradient(180deg, #00c6ff 0%, #0072ff 100%);
      box-shadow: 0 0 20px rgba(0, 225, 255, 0.7);
    }
    .btn.trig {
      background: linear-gradient(180deg, #101624 0%, #080c14 100%);
      color: #64b5f6;
      border: 1px solid rgba(0, 102, 255, 0.25);
      font-size: 1.1rem; font-weight: 700; height: 48px;
    }
    .btn.trig:hover {
      background: linear-gradient(180deg, #182033 0%, #0c121e 100%);
      border-color: #0099ff; color: #90caf9;
      box-shadow: 0 0 10px rgba(0, 153, 255, 0.35);
    }
    .btn.special {
      background: linear-gradient(180deg, #141724 0%, #090b14 100%);
      color: #4fc3f7;
      border: 1px solid rgba(0, 180, 255, 0.25);
      font-size: 1.1rem; font-weight: 700; height: 48px;
    }
    .btn.special:hover {
      background: linear-gradient(180deg, #1c2236 0%, #0e1221 100%);
      border-color: #00d2ff; color: #81d4fa;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
    }
    .btn.paren {
      background: linear-gradient(180deg, #121c2e 0%, #09101c 100%);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 1.3rem; font-weight: 700;
    }
    .btn.paren:hover {
      background: linear-gradient(180deg, #192740 0%, #0d1729 100%);
      border-color: #38bdf8; color: #bae6fd;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.45);
    }
    .btn.zero { grid-column: span 2; }
    .result.error { color: #ff4757 !important; font-size: 1.4rem !important; text-shadow: 0 0 10px rgba(255, 71, 87, 0.5) !important; }
    .btn.logfn {
      background: linear-gradient(180deg, #0e1924 0%, #060e17 100%);
      color: #00e5ff;
      border: 1px solid rgba(0, 229, 255, 0.25);
      font-size: 1.05rem; font-weight: 700; height: 48px;
    }
    .btn.logfn:hover {
      background: linear-gradient(180deg, #142433 0%, #091521 100%);
      border-color: #00e5ff; color: #80f4ff;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
    }
  </style>
</head>
<body>

<div class="calculator">
  <div class="calc-title">🐐 Kshitij Da Goat </div>

  <!-- DEG / RAD -->
  <div class="mode-row">
    <div class="mode-toggle">
      <button id="btn-deg" class="active" onclick="setMode('deg')">DEG</button>
      <button id="btn-rad" onclick="setMode('rad')">RAD</button>
    </div>
  </div>

  <!-- Display -->
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <!-- Button Grid -->
  <div class="buttons">

    <!-- Section: Trig & Special -->
    <div class="section-label">&#9135; Trigonometric &amp; Special Functions &#9135;</div>

    <button class="btn trig"    data-action="func"     data-value="sin">sin</button>
    <button class="btn trig"    data-action="func"     data-value="cos">cos</button>
    <button class="btn trig"    data-action="func"     data-value="tan">tan</button>
    <button class="btn special" data-action="gif-toggle" id="btn-gif">[x] GIF</button>

    <button class="btn trig"    data-action="func"     data-value="cosec">cosec</button>
    <button class="btn trig"    data-action="func"     data-value="sec">sec</button>
    <button class="btn trig"    data-action="func"     data-value="cot">cot</button>
    <button class="btn special" data-action="func"     data-value="sqrt">&#x221A;x</button>

    <!-- Top Scientific Row: Parentheses, Cube Root, Power -->
    <button class="btn paren"   data-action="paren"    data-value="(">(</button>
    <button class="btn paren"   data-action="paren"    data-value=")">)</button>
    <button class="btn special" data-action="operator" data-value="pow">xʸ</button>
    <button class="btn special" data-action="func"     data-value="cbrt">&#x221B;x</button>

  </div><!-- /.buttons -->

  <hr class="divider" />

  <!-- 5-Column Numpad: Left Column has π, e, |x| -->
  <div class="numpad-grid">
    <!-- Row 1 -->
    <button class="btn logfn"    data-action="constant"  data-value="pi">&#x03C0;</button>
    <button class="btn modifier" data-action="clear">AC</button>
    <button class="btn modifier" data-action="percent">%</button>
    <button class="btn modifier" data-action="backspace">&#x232B;</button>
    <button class="btn operator" data-action="operator"  data-value="div">&#247;</button>

    <!-- Row 2 -->
    <button class="btn logfn" data-action="constant" data-value="e">e</button>
    <button class="btn"       data-action="number"   data-value="7">7</button>
    <button class="btn"       data-action="number"   data-value="8">8</button>
    <button class="btn"       data-action="number"   data-value="9">9</button>
    <button class="btn operator" data-action="operator" data-value="mul">&#215;</button>

    <!-- Row 3 -->
    <button class="btn logfn" data-action="mod"    data-value="|">|x|</button>
    <button class="btn"       data-action="number" data-value="4">4</button>
    <button class="btn"       data-action="number" data-value="5">5</button>
    <button class="btn"       data-action="number" data-value="6">6</button>
    <button class="btn operator" data-action="operator" data-value="sub">&#8722;</button>

    <!-- Row 4 -->
    <button class="btn logfn" data-action="func"   data-value="ln">ln</button>
    <button class="btn"       data-action="number" data-value="1">1</button>
    <button class="btn"       data-action="number" data-value="2">2</button>
    <button class="btn"       data-action="number" data-value="3">3</button>
    <button class="btn operator" data-action="operator" data-value="add">+</button>

    <!-- Row 5 -->
    <button class="btn logfn" data-action="func"   data-value="log10">log</button>
    <button class="btn zero"  data-action="number" data-value="0">0</button>
    <button class="btn"       data-action="decimal">.</button>
    <button class="btn equals" data-action="equals">=</button>
  </div>
</div>

<script>
  var expr = '';       // Full raw expression being composed
  var mode = 'deg';    // 'deg' or 'rad'
  var isCalculated = false;
  var expEl = document.getElementById('expression');
  var resEl = document.getElementById('result');

  function setMode(m) {
    mode = m;
    document.getElementById('btn-deg').classList.toggle('active', m === 'deg');
    document.getElementById('btn-rad').classList.toggle('active', m === 'rad');
  }

  function toRad(d) { return d * Math.PI / 180; }

  function fmt(n) {
    if (isNaN(n) || !isFinite(n)) return null;
    if (Math.abs(n) < 1e-14) return '0';
    return String(parseFloat(n.toPrecision(12)));
  }

  function getDisplayExpression(raw) {
    return raw
      .replace(/\*/g, ' \u00D7 ')
      .replace(/\//g, ' \u00F7 ')
      .replace(/\+/g, ' + ')
      .replace(/-/g, ' \u2212 ')
      .replace(/\^/g, ' ^ ')
      .replace(/pi/g, '\u03C0')
      .replace(/sqrt\(/g, '\u221A(')
      .replace(/cbrt\(/g, '\u221B(');
  }

  function updateGifButtonState() {
    var gifBtn = document.getElementById('btn-gif');
    if (!gifBtn) return;
    var openCount = (expr.match(/\[/g) || []).length;
    var closeCount = (expr.match(/\]/g) || []).length;
    if (openCount > closeCount) {
      gifBtn.textContent = '] GIF';
      gifBtn.title = 'Close greatest integer function';
    } else {
      gifBtn.textContent = '[x] GIF';
      gifBtn.title = 'Open greatest integer function';
    }
  }

  function updDisplay(isErr) {
    updateGifButtonState();
    if (isErr) {
      resEl.textContent = 'Error';
      resEl.className = 'result error';
      return;
    }
    resEl.className = 'result';
    if (!expr) {
      resEl.textContent = '0';
      expEl.textContent = '';
      return;
    }
    resEl.textContent = expr.length > 0 ? getDisplayExpression(expr) : '0';
    var l = resEl.textContent.length;
    resEl.style.fontSize = l > 18 ? '1.3rem' : l > 12 ? '1.7rem' : '2.2rem';
  }

  function addChar(c) {
    if (isCalculated) {
      if ('0123456789.(pi e sin cos tan cosec sec cot sqrt cbrt abs ln log10 | [ ]'.split(' ').some(function(k){ return c.startsWith(k); })) {
        expr = '';
      }
      isCalculated = false;
      expEl.textContent = '';
    }
    expr += c;
    updDisplay(false);
  }

  function addOp(opSymbol) {
    if (isCalculated) {
      isCalculated = false;
      expEl.textContent = '';
    }
    if (!expr && opSymbol !== '-') return;
    var lastChar = expr.slice(-1);
    if ('+-*/^'.indexOf(lastChar) >= 0) {
      expr = expr.slice(0, -1) + opSymbol;
    } else {
      expr += opSymbol;
    }
    updDisplay(false);
  }

  function addFunc(fname) {
    if (isCalculated) {
      expr = '';
      isCalculated = false;
      expEl.textContent = '';
    }
    expr += fname + '(';
    updDisplay(false);
  }

  function addParen(p) {
    if (isCalculated) {
      if (p === '(') expr = '';
      isCalculated = false;
      expEl.textContent = '';
    }
    expr += p;
    updDisplay(false);
  }

  function addGifToggle() {
    var openCount = (expr.match(/\[/g) || []).length;
    var closeCount = (expr.match(/\]/g) || []).length;
    var bracket = openCount > closeCount ? ']' : '[';
    if (isCalculated) {
      if (bracket === '[') expr = '';
      isCalculated = false;
      expEl.textContent = '';
    }
    expr += bracket;
    updDisplay(false);
  }

  function addMod() {
    if (isCalculated) {
      expr = '';
      isCalculated = false;
      expEl.textContent = '';
    }
    expr += '|';
    updDisplay(false);
  }

  function addConstant(c) {
    if (isCalculated) {
      expr = '';
      isCalculated = false;
      expEl.textContent = '';
    }
    expr += c;
    updDisplay(false);
  }

  function clr() {
    expr = '';
    isCalculated = false;
    expEl.textContent = '';
    updDisplay(false);
  }

  function bksp() {
    if (isCalculated) {
      clr();
      return;
    }
    if (!expr) return;
    // Check multi-character function names at tail (e.g. cosec(, sqrt(, cbrt(, etc.)
    var fns = ['cosec(', 'sec(', 'cot(', 'sin(', 'cos(', 'tan(', 'sqrt(', 'cbrt(', 'abs(', 'log10(', 'ln('];
    var matched = false;
    for (var i = 0; i < fns.length; i++) {
      if (expr.endsWith(fns[i])) {
        expr = expr.slice(0, -fns[i].length);
        matched = true;
        break;
      }
    }
    if (!matched) {
      expr = expr.slice(0, -1);
    }
    updDisplay(false);
  }

  function pct() {
    if (!expr) return;
    if (isCalculated) isCalculated = false;
    expr += '*0.01';
    calculate();
  }

  function parseModPairs(str) {
    var barCount = (str.match(/\|/g) || []).length;
    if (barCount % 2 !== 0) {
      throw new Error('Unclosed modulus');
    }
    while (str.indexOf('|') !== -1) {
      var first = str.indexOf('|');
      var second = str.indexOf('|', first + 1);
      if (second === -1) {
        throw new Error('Unclosed modulus');
      }
      var inside = str.substring(first + 1, second);
      str = str.substring(0, first) + '_abs(' + inside + ')' + str.substring(second + 1);
    }
    return str;
  }

  function parseGifPairs(str) {
    var openCount = (str.match(/\[/g) || []).length;
    var closeCount = (str.match(/\]/g) || []).length;
    if (openCount !== closeCount) {
      throw new Error('Unmatched GIF brackets');
    }
    // Parse innermost [ ... ] to _gif( ... )
    while (str.indexOf('[') !== -1) {
      var match = str.match(/\[([^\[\]]+)\]/);
      if (!match) {
        throw new Error('Mismatched GIF brackets');
      }
      str = str.replace(match[0], '_gif(' + match[1] + ')');
    }
    return str;
  }

  function evaluateAlgebraic(rawExpr) {
    if (!rawExpr.trim()) return 0;
    var s = rawExpr;

    // Convert paired |...| to _abs(...) and throw error if odd number of bars
    s = parseModPairs(s);

    // Convert paired [...] to _gif(...) and throw error if brackets are not closed
    s = parseGifPairs(s);

    // Auto close unclosed parentheses
    var opens = (s.match(/\(/g) || []).length;
    var closes = (s.match(/\)/g) || []).length;
    while (opens > closes) {
      s += ')';
      closes++;
    }

    // Replace constant literals
    s = s.replace(/\bpi\b/g, '(' + Math.PI + ')');
    s = s.replace(/\be\b/g, '(' + Math.E + ')');

    // Replace power x^y with Math.pow(x,y) using regex handling
    while (s.includes('^')) {
      s = s.replace(/([0-9.]+|\([^\(\)]+\))\^([0-9.]+|\([^\(\)]+\))/, 'Math.pow($1,$2)');
    }

    // Prepare trig wrapper based on current angle mode
    var _sin = function(a){ var r = Math.sin(mode==='deg' ? toRad(a) : a); return Math.abs(r)<1e-14?0:r; };
    var _cos = function(a){ var r = Math.cos(mode==='deg' ? toRad(a) : a); return Math.abs(r)<1e-14?0:r; };
    var _tan = function(a){ var c = Math.cos(mode==='deg'?toRad(a):a); if (Math.abs(c)<1e-10) return NaN; var r = Math.tan(mode==='deg'?toRad(a):a); return Math.abs(r)<1e-14?0:r; };
    var _cosec = function(a){ var s = Math.sin(mode==='deg'?toRad(a):a); if (Math.abs(s)<1e-14) return NaN; return 1/s; };
    var _sec = function(a){ var c = Math.cos(mode==='deg'?toRad(a):a); if (Math.abs(c)<1e-14) return NaN; return 1/c; };
    var _cot = function(a){ var s = Math.sin(mode==='deg'?toRad(a):a); if (Math.abs(s)<1e-14) return NaN; var c = Math.cos(mode==='deg'?toRad(a):a); return Math.abs(c)<1e-14?0:c/s; };
    var _gif = function(a){ return Math.floor(a); };
    var _sqrt = function(a){ return a<0?NaN:Math.sqrt(a); };
    var _cbrt = function(a){ return Math.cbrt(a); };
    var _abs = function(a){ return Math.abs(a); };
    var _ln = function(a){ return a<=0?NaN:Math.log(a); };
    var _log10 = function(a){ return a<=0?NaN:Math.log10(a); };

    s = s.replace(/\bsin\b/g, '_sin')
         .replace(/\bcos\b/g, '_cos')
         .replace(/\btan\b/g, '_tan')
         .replace(/\bcosec\b/g, '_cosec')
         .replace(/\bsec\b/g, '_sec')
         .replace(/\bcot\b/g, '_cot')
         .replace(/\bsqrt\b/g, '_sqrt')
         .replace(/\bcbrt\b/g, '_cbrt')
         .replace(/\bln\b/g, '_ln')
         .replace(/\blog10\b/g, '_log10');

    // Safe execution of mathematical expression
    var fn = new Function('_sin', '_cos', '_tan', '_cosec', '_sec', '_cot', '_gif', '_sqrt', '_cbrt', '_abs', '_ln', '_log10', 'return (' + s + ');');
    return fn(_sin, _cos, _tan, _cosec, _sec, _cot, _gif, _sqrt, _cbrt, _abs, _ln, _log10);
  }

  function calculate() {
    if (!expr) return;
    try {
      var fullExp = expr;
      var val = evaluateAlgebraic(expr);
      if (isNaN(val) || !isFinite(val)) {
        expEl.textContent = getDisplayExpression(fullExp) + ' =';
        resEl.textContent = 'Undefined';
        resEl.className = 'result error';
        isCalculated = true;
      } else {
        var formatted = fmt(val) || '0';
        expEl.textContent = getDisplayExpression(fullExp) + ' =';
        resEl.textContent = formatted;
        resEl.className = 'result';
        expr = formatted;
        isCalculated = true;
      }
    } catch(e) {
      resEl.textContent = 'Error';
      resEl.className = 'result error';
      isCalculated = true;
    }
  }

  document.querySelector('.calculator').addEventListener('click', function(e) {
    var btn = e.target.closest('.btn'); if (!btn) return;
    var a = btn.dataset.action, v = btn.dataset.value;
    if      (a === 'number')     addChar(v);
    else if (a === 'decimal')    addChar('.');
    else if (a === 'paren')      addParen(v);
    else if (a === 'gif-toggle') addGifToggle();
    else if (a === 'gif')        addGif(v);
    else if (a === 'mod')        addMod();
    else if (a === 'operator') {
      if (v === 'add') addOp('+');
      else if (v === 'sub') addOp('-');
      else if (v === 'mul') addOp('*');
      else if (v === 'div') addOp('/');
      else if (v === 'pow') addOp('^');
    }
    else if (a === 'equals')    calculate();
    else if (a === 'clear')     clr();
    else if (a === 'backspace') bksp();
    else if (a === 'percent')   pct();
    else if (a === 'func')      addFunc(v);
    else if (a === 'constant')  addConstant(v);
  });

  document.addEventListener('keydown', function(e) {
    var k = e.key;
    if (k >= '0' && k <= '9') addChar(k);
    else if (k === '.')       addChar('.');
    else if (k === '(' || k === ')') addParen(k);
    else if (k === '[' || k === ']') addGif(k);
    else if (k === '|')       addMod();
    else if (k === '+')       addOp('+');
    else if (k === '-')       addOp('-');
    else if (k === '*')       addOp('*');
    else if (k === '/') { e.preventDefault(); addOp('/'); }
    else if (k === '^')       addOp('^');
    else if (k === '%')       pct();
    else if (k === 'Enter' || k === '=') calculate();
    else if (k === 'Backspace') bksp();
    else if (k === 'Escape' || k === 'Delete') clr();
  });
</script>
